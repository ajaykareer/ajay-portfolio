<!-- Optional portfolio-specific replacement for the Contact Us template body.
     In EmailJS use Subject: {{title}}, From Name: {{name}}, Reply To: {{email}}.
     Keep To Email fixed to Ajay's chosen receiving inbox. -->
<div style="background:#f7f8fa;padding:32px 16px;font-family:Arial,sans-serif;color:#222528">
  <div style="max-width:560px;margin:auto;background:#fff;border:1px solid #e1e4e7;border-radius:14px;overflow:hidden">
    <div style="height:5px;background:#ff6947"></div>
    <div style="padding:32px">
      <p style="color:#866452;font-size:11px;letter-spacing:2px;margin:0 0 18px">AJAY KAREER · PORTFOLIO</p>
      <h1 style="font-size:28px;line-height:1.2;font-weight:500;margin:0 0 24px">A new hello from {{name}}.</h1>
      <p style="font-size:14px;line-height:1.7;margin:0 0 4px"><strong>Name:</strong> {{name}}</p>
      <p style="font-size:14px;line-height:1.7;margin:0 0 24px"><strong>Email:</strong> {{email}}</p>
      <div style="background:#fcf8f4;border:1px solid #e6d9cd;border-radius:8px;padding:20px;white-space:pre-wrap;font-size:15px;line-height:1.8">{{message}}</div>
      <p style="font-size:12px;line-height:1.6;color:#697078;margin:24px 0 0">Received {{date}} at {{time}}.<br />Reply to this email to continue the conversation.</p>
    </div>
  </div>
</div>
